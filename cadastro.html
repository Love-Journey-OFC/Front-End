<!doctype html>
<html lang="pt-BR">
  <head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link
      rel="icon"
      href="./assets/imgs/jadi/img/logolove.png"
      type="image/png"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Love Journey | Cadastro</title>

    <link rel="stylesheet" href="./css/autenticacao/autenticacao.css" />
    <link rel="stylesheet" href="./css/autenticacao/cadastro.css" />
  </head>

  <body class="corpo-cadastro">
    <div class="tela-cadastro">
      <!-- Coluna esquerda: formulário -->
      <div class="painel-form">
        <!-- LOGO (troque o nome do arquivo se o seu for diferente) -->
        <img
          src="./assets/imgs/logo love journey.png"
          alt="Love Journey"
          class="logo-form-img"
        />

        <h2 class="titulo-cadastro" id="titulo-cadastro">Cadastrar-se</h2>

        <p class="subtitulo-cadastro">
          Bem-vindo! Por favor, insira seus dados.
        </p>

        <form id="form-cadastro" novalidate>
          <!-- Nome -->
          <div class="grupo-campo">
            <label for="nome"> Nome </label>

            <input
              type="text"
              id="nome"
              name="nome"
              placeholder="Digite seu nome"
              autocomplete="given-name"
              required
            />
          </div>

          <!-- Sobrenome -->
          <div class="grupo-campo">
            <label for="sobrenome"> Sobrenome </label>

            <input
              type="text"
              id="sobrenome"
              name="sobrenome"
              placeholder="Digite seu sobrenome"
              autocomplete="family-name"
              required
            />
          </div>

          <!-- E-mail -->
          <div class="grupo-campo">
            <label for="email"> E-mail </label>

            <input
              type="email"
              id="email"
              name="email"
              placeholder="Digite seu e-mail"
              autocomplete="email"
              required
            />
          </div>

          <!-- CNPJ -->
          <div class="grupo-campo" id="grupo-cnpj">
            <label for="cnpj"> CNPJ </label>

            <input
              type="text"
              id="cnpj"
              name="cnpj"
              placeholder="Digite o CNPJ da empresa"
              inputmode="numeric"
            />
          </div>

          <!-- Senha -->
          <div class="grupo-campo">
            <label for="senha"> Senha </label>

            <div class="campo-com-icone">
              <input
                type="password"
                id="senha"
                name="senha"
                placeholder="Crie uma senha"
                minlength="8"
                autocomplete="new-password"
                required
              />

              <button
                type="button"
                class="botao-olho-cadastro"
                data-alvo="senha"
                aria-label="Mostrar senha"
              >
                <i aria-hidden="true" class="fa-solid fa-eye"></i>
              </button>
            </div>

            <span class="dica-campo"> Deve ter pelo menos 8 caracteres </span>
          </div>

          <!-- Confirmar senha -->
          <div class="grupo-campo">
            <label for="confirmar-senha"> Confirme senha </label>

            <div class="campo-com-icone">
              <input
                type="password"
                id="confirmar-senha"
                name="confirmar-senha"
                placeholder="Digite sua senha novamente"
                minlength="8"
                autocomplete="new-password"
                required
              />

              <button
                type="button"
                class="botao-olho-cadastro"
                data-alvo="confirmar-senha"
                aria-label="Mostrar senha"
              >
                <i aria-hidden="true" class="fa-solid fa-eye"></i>
              </button>
            </div>

            <span class="dica-campo" id="erro-senha">
              Deve ter pelo menos 8 caracteres.
            </span>
          </div>

          <!-- Termos -->
          <label class="linha-termos">
            <input
              type="checkbox"
              id="aceitar-termos"
              name="aceitar-termos"
              required
            />

            <span>
              Aceitar termos e condições
              <a href="#"> política de privacidade </a>
            </span>
          </label>

          <!-- Cadastrar -->
          <button type="submit" class="btn btn-rosa btn-cadastrar">
            Cadastrar Agora
          </button>

          <!-- Google -->
          <button type="button" class="btn-google">
            <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
              <path
                fill="#FFC107"
                d="M43.6 20.5H42V20H24v8h11.3C33.7 32.9 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6.1 29.6 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-4z"
              />

              <path
                fill="#FF3D00"
                d="M6.3 14.7l6.6 4.8C14.6 15.9 18.9 13 24 13c3.1 0 5.8 1.1 8 3l5.7-5.7C34.6 6.1 29.6 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"
              />

              <path
                fill="#4CAF50"
                d="M24 44c5.5 0 10.4-1.9 14.3-5.1l-6.6-5.4C29.6 35.4 26.9 36 24 36c-5.3 0-9.7-3.1-11.3-7.4l-6.6 5.1C9.6 39.6 16.3 44 24 44z"
              />

              <path
                fill="#1976D2"
                d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.3 4.2-4.2 5.5l6.6 5.4C40.9 36.5 44 30.8 44 24c0-1.3-.1-2.7-.4-3.5z"
              />
            </svg>

            Entrar com o Google
          </button>

          <!-- Login -->
          <p class="texto-login">
            Já possui uma conta?

            <a href="login.html" id="link-login"> Entrar </a>
          </p>
        </form>
      </div>

      <!-- Coluna direita: painel visual -->
      <div class="painel-visual">
        <div class="logo-marca">
          <!-- IMAGEM DO LOVE JOURNEY -->
          <img
            src="./assets/imgs/logo love journey.png"
            alt="Love Journey"
            class="imagem-cadastro"
          />
        </div>
      </div>
    </div>

    <script src="./js/autenticacao/cadastro.js"></script>
  </body>
</html>
