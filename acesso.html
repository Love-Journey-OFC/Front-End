<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="./assets/imgs/jadi/img/logolove.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <title>Love Journey | Bem-vindo</title>

  <link rel="stylesheet" href="css/auth.css">
</head>

<body>

<!-- Onda decorativa -->
  <svg
    class="onda"
    viewBox="0 0 1440 200"
    preserveAspectRatio="none"
    xmlns="http://www.w3.org/2000/svg"
  >
    <path
      d="M0,80
         C180,140 360,20 540,60
         C720,100 900,140 1080,90
         C1260,50 1350,70 1440,90
         L1440,200
         L0,200
         Z"
      fill="var(--rosa)"
    />
  </svg>


  <!-- Conteúdo -->
  <main class="container">

    <!-- LOGO (imagem no lugar do texto) -->
    <img
      src="assets/imgs/icone_tipo.png"
      alt="Love Journey"
      class="logo-img"
    >

    <p class="saudacao">
      Olá, bem-vindo
    </p>

    <p class="pergunta">
      Para começarmos, identifique seu perfil de acesso
    </p>

    <div class="divisor">
      <a href="login.html" class="link-email">
        ou entre com seu e-mail
      </a>
    </div>

    <div class="opcoes">

      <button
        type="button"
        class="btn btn-rosa"
        id="btn-profissional"
      >
        Sou Profissional
      </button>

      <button
        type="button"
        class="btn btn-verde"
        id="btn-cliente"
      >
        Sou Cliente
      </button>

    </div>

  </main>


  <script src="js/script.js"></script>

</body>
</html>
